  </div>

<section class="hero hero-secondary"><div class="hero-content"><h1>Share Your Feedback</h1><p>Your experience helps us improve every day.</p></div></section>

<section>
  <div class="container">
    <form class="form-card" action="feedback.php" method="post">
      <h3>Feedback Form</h3>
      <label>Name</label>
      <input name="name" required>

      <label>Email</label>
      <input name="email" type="email" required>

      <label>Rating</label>
      <div class="star-row">
        <button type="button" aria-label="1 star">*</button>
        <button type="button" aria-label="2 stars">*</button>
        <button type="button" aria-label="3 stars">*</button>
        <button type="button" aria-label="4 stars">*</button>
        <button type="button" aria-label="5 stars">*</button>
      </div>
      <input id="ratingValue" name="rating" type="hidden" required>

      <label>How did you feel?</label>
      <div class="emoji-row">
        <button type="button" class="emoji-btn" data-emoji="happy">Happy</button>
        <button type="button" class="emoji-btn" data-emoji="excited">Excited</button>
        <button type="button" class="emoji-btn" data-emoji="okay">Okay</button>
        <button type="button" class="emoji-btn" data-emoji="bad">Bad</button>
      </div>
      <input id="emojiReaction" name="emoji" type="hidden">

      <label>Feedback</label>
      <textarea name="message" required></textarea>
      <button class="button" type="submit" style="margin-top:12px;">Submit Feedback</button>
    </form>
  </div>
</section>
