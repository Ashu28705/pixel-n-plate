<section class="hero hero-secondary"><div class="hero-content"><h1>Book Your Experience</h1><p>Fast 3-step booking with live validation-friendly flow.</p></div></section>

<section>
  <div class="container">
    <form id="bookingWizard" class="form-card" action="book_event.php" method="post">
      <h2>Event Booking</h2>
      <div class="form-progress"><span></span></div>

      <div class="step active">
        <label for="name">Full Name</label><input id="name" name="name" required>
        <label for="email">Email</label><input id="email" name="email" type="email" required>
        <label for="phone">Phone</label><input id="phone" name="phone" type="tel" required>
        <button type="button" class="button next-step" style="margin-top:12px;">Next</button>
      </div>

      <div class="step">
        <label for="event">Select Event</label>
        <select id="event" name="event" required>
          <option value="">Choose an event</option>
          <option>Gaming Tournament</option>
          <option>Open Mic Night</option>
          <option>Birthday Package</option>
          <option>Community Meetup</option>
        </select>
        <label for="date">Preferred Date</label><input id="date" name="date" type="date" required>
        <label for="notes">Additional Notes</label><textarea id="notes" name="notes" placeholder="Tell us your special requests"></textarea>
        <button type="button" class="button prev-step" style="margin-top:12px;">Back</button>
        <button type="button" class="button next-step" style="margin-top:12px;">Next</button>
      </div>

      <div class="step">
        <p style="color:var(--text-1);">Review details and confirm your booking.</p>
        <button type="button" class="button prev-step" style="margin-top:12px;">Back</button>
        <button type="submit" class="button" style="margin-top:12px;">Confirm Booking</button>
      </div>
    </form>
  </div>
</section>
